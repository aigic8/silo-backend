services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: silo
      POSTGRES_PASSWORD: silo
      POSTGRES_DB: silo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silo -d silo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - silo_db_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://silo:silo@db:5432/silo
      BIND_ADDR: 0.0.0.0:3000
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://127.0.0.1:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  silo_db_data:
