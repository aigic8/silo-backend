name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: silo
          POSTGRES_PASSWORD: silo
          POSTGRES_DB: silo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ready for DB integration tests added later; unused by the bootstrap
      # build but set on every job so future test steps need no workflow edit.
      DATABASE_URL: postgres://silo:silo@localhost:5432/silo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
